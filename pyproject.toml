[project]
name = "simvue-remkit"
version = "1.0.0a1"
description = "Connector for viewing results from ReMKiT-1D simulations in Simvue."
authors = [
    {name = "Matt Field",email = "matthew.field@ukaea.uk"}
]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "simvue (>=2.2.2)",
    "simvue-connector",
    "h5py (>=3.14.0,<4.0.0)",
    "rmk-support @ git+https://github.com/ukaea/ReMKiT1D-Python.git",
    ]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: Unix",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
    "Typing :: Typed"
]
keywords = [
    "tracking",
    "monitoring",
    "metrics",
    "alerting",
    "metrics-gathering"
]

[project.urls]
homepage = "https://simvue.io"
repository = "https://github.com/simvue-io/connectors-template"
documentation = "https://docs.simvue.io"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
